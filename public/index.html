<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://royallagn.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoyalLagn" />
    <meta property="og:title" content="RoyalLagn | Discover Trusted Wedding Vendors" />
    <meta property="og:description" content="Discover trusted wedding photographers, venues, decorators, makeup artists and more with RoyalLagn. Explore verified wedding vendors and send enquiries directly." />
    <meta property="og:url" content="https://royallagn.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RoyalLagn | Discover Trusted Wedding Vendors" />
    <meta name="twitter:description" content="Discover trusted wedding photographers, venues, decorators, makeup artists and more with RoyalLagn. Explore verified wedding vendors and send enquiries directly." />
    <script>
      if (/admin/i.test(window.location.pathname) || window.location.pathname === "/VendorApplications") {
        const manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = "/admin-manifest.webmanifest";
        manifest.dataset.royallagnAdminManifest = "true";
        document.head.appendChild(manifest);

        const icon = document.createElement("link");
        icon.rel = "apple-touch-icon";
        icon.href = "/admin-icon-192.png";
        icon.dataset.royallagnAdminIcon = "true";
        document.head.appendChild(icon);
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://royallagn.com/#organization",
            "name": "RoyalLagn",
            "url": "https://royallagn.com/",
            "description": "RoyalLagn helps couples discover trusted wedding vendors and send enquiries directly."
          },
          {
            "@type": "WebSite",
            "@id": "https://royallagn.com/#website",
            "url": "https://royallagn.com/",
            "name": "RoyalLagn",
            "alternateName": ["Royal Lagn", "royallagn.com"],
            "publisher": { "@id": "https://royallagn.com/#organization" },
            "inLanguage": "en-IN"
          }
        ]
      }
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>RoyalLagn helps couples discover trusted wedding vendors. Please enable JavaScript to explore vendors and send enquiries.</noscript>
    <div id="root"></div>
  </body>
</html>
