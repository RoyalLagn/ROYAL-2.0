<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://royallagn.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoyalLagn" />
    <meta property="og:title" content="RoyalLagn | Discover Trusted Wedding Vendors" />
    <meta property="og:description" content="Discover trusted wedding photographers, venues, decorators, makeup artists and more with RoyalLagn. Explore verified wedding vendors and send enquiries directly." />
    <meta property="og:url" content="https://royallagn.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RoyalLagn | Discover Trusted Wedding Vendors" />
    <meta name="twitter:description" content="Discover trusted wedding photographers, venues, decorators, makeup artists and more with RoyalLagn. Explore verified wedding vendors and send enquiries directly." />
    <meta name="theme-color" content="#E91E63" />
    <link id="royallagn-pwa-manifest" rel="manifest" href="/manifest.webmanifest" />
    <link id="royallagn-apple-touch-icon" rel="apple-touch-icon" href="/icon-180.png" />
    <script>
      (() => {
        const manifest = document.getElementById("royallagn-pwa-manifest");
        const appleTouchIcon = document.getElementById("royallagn-apple-touch-icon");
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const isAdminRoute = () =>
          /admin/i.test(window.location.pathname) ||
          window.location.pathname === "/VendorApplications";

        const syncPwaMetadata = () => {
          const admin = isAdminRoute();
          manifest.href = admin ? "/admin-manifest.webmanifest" : "/manifest.webmanifest";
          appleTouchIcon.href = admin ? "/admin-icon-192.png" : "/icon-180.png";
          themeColor.content = admin ? "#06234D" : "#E91E63";
        };

        syncPwaMetadata();

        for (const method of ["pushState", "replaceState"]) {
          const original = history[method];
          history[method] = function (...args) {
            const result = original.apply(this, args);
            queueMicrotask(syncPwaMetadata);
            return result;
          };
        }
        window.addEventListener("popstate", syncPwaMetadata);

        window.__royalLagnAdminInstallPrompt = null;
        window.addEventListener("beforeinstallprompt", (event) => {
          if (!isAdminRoute()) return;
          event.preventDefault();
          window.__royalLagnAdminInstallPrompt = event;
          window.dispatchEvent(new Event("royallagn-admin-install-ready"));
        });
        window.addEventListener("appinstalled", () => {
          window.__royalLagnAdminInstallPrompt = null;
        });

        if ("serviceWorker" in navigator) {
          const localDevelopment = location.hostname === "localhost" || location.hostname === "127.0.0.1";
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(
              registrations
                .filter((registration) =>
                  localDevelopment ||
                  [registration.installing, registration.waiting, registration.active]
                    .some((worker) => worker && worker.scriptURL.endsWith("/admin-service-worker.js")),
                )
                .map((registration) => registration.unregister()),
            ))
            .then(() => {
              if (!localDevelopment) {
                return navigator.serviceWorker.register("/service-worker.js", { scope: "/" });
              }
              return undefined;
            })
            .catch(() => undefined);
        }

        if ("caches" in window) {
          caches.keys()
            .then((keys) => Promise.all(
              keys
                .filter((key) => key.startsWith("royallagn-admin-"))
                .map((key) => caches.delete(key)),
            ))
            .catch(() => undefined);
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://royallagn.com/#organization",
            "name": "RoyalLagn",
            "url": "https://royallagn.com/",
            "description": "RoyalLagn helps couples discover trusted wedding vendors and send enquiries directly."
          },
          {
            "@type": "WebSite",
            "@id": "https://royallagn.com/#website",
            "url": "https://royallagn.com/",
            "name": "RoyalLagn",
            "alternateName": ["Royal Lagn", "royallagn.com"],
            "publisher": { "@id": "https://royallagn.com/#organization" },
            "inLanguage": "en-IN"
          }
        ]
      }
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>RoyalLagn helps couples discover trusted wedding vendors. Please enable JavaScript to explore vendors and send enquiries.</noscript>
    <div id="root"></div>
  </body>
</html>
