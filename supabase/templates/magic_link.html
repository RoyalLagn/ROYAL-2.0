<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fff7fa;font-family:Arial,sans-serif;color:#2b2025">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <h1 style="margin:0 0 8px;color:#e91e63;font-size:28px">RoyalLagn</h1>
      <h2 style="margin:24px 0 12px;font-size:22px">Your verification code</h2>
      <p style="margin:0 0 20px;line-height:1.6;color:#6b5b63">
        Enter this one-time verification code in the RoyalLagn app:
      </p>
      <div style="padding:18px;border-radius:14px;background:#ffffff;border:1px solid #f3c4d5;text-align:center;font-size:34px;font-weight:700;letter-spacing:10px;color:#e91e63">
        {{ .Token }}
      </div>
      <p style="margin:20px 0 0;font-size:13px;line-height:1.5;color:#8a7880">
        This code expires shortly. If you did not request it, you can ignore this email.
      </p>
    </div>
  </body>
</html>
